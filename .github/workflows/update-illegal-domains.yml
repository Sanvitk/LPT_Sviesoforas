name: Update illegal domains

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NKSC list
        run: |
          curl -L "https://www.nksc.lt/doc/vasaris/siena-lpt.txt" -o illegal_domains.txt

      - name: Commit updated list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add illegal_domains.txt
          git commit -m "Auto-update illegal domains" || echo "No changes"
          git push
